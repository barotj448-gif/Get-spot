<style>
    @layer base {
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }

    /* 2D Micro-interaction Animation */
    @keyframes moveDot {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      70% {
        transform: translateX(112px);
        opacity: 1;
      }
      82% {
        transform: translateX(112px);
        opacity: 0;
      }
      100% {
        transform: translateX(112px);
        opacity: 0;
      }
    }

    @keyframes pulseTargetRing {
      0%, 65% {
        transform: scale(0.65);
        opacity: 0;
      }
      72% {
        transform: scale(0.9);
        opacity: 0.9;
      }
      88% {
        transform: scale(1.6);
        opacity: 0;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    @keyframes markerPop {
      0%, 66% {
        transform: scale(1);
      }
      74% {
        transform: scale(1.12);
      }
      84% {
        transform: scale(1);
      }
      100% {
        transform: scale(1);
      }
    }

    .animate-spot-dot {
      animation: moveDot 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .animate-spot-ring {
      animation: pulseTargetRing 3.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      transform-origin: center;
    }
    .animate-marker-pop {
      animation: markerPop 3.2s ease-out infinite;
      transform-origin: bottom center;
    }
  </style>

  <style>
    @keyframes mapRouteTrace {
      0%, 12% { stroke-dashoffset: 160; opacity: 0.3; }
      55%, 85% { stroke-dashoffset: 0; opacity: 1; }
      92%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes mapUserTravel {
      0% { offset-distance: 0%; opacity: 0; transform: scale(0.7); }
      10% { offset-distance: 0%; opacity: 1; transform: scale(1); }
      62% { offset-distance: 100%; opacity: 1; transform: scale(1); }
      72%, 85% { offset-distance: 100%; opacity: 0.85; transform: scale(0.9); }
      92%, 100% { offset-distance: 100%; opacity: 0; transform: scale(0.6); }
    }
    @keyframes userHaloPulse {
      0%, 10% { transform: scale(1); opacity: 0.8; }
      30% { transform: scale(2.2); opacity: 0; }
      31%, 100% { transform: scale(1); opacity: 0; }
    }
    @keyframes spotPinReact {
      0%, 58% { transform: scale(1); }
      66% { transform: translateY(-4px) scale(1.15); }
      74% { transform: translateY(0) scale(1); }
      82% { transform: scale(1.04); }
      90%, 100% { transform: scale(1); }
    }
    @keyframes spotRipplePulse {
      0%, 60% { transform: scale(0.6); opacity: 0; }
      66% { transform: scale(0.9); opacity: 0.8; stroke-width: 2.5; }
      84% { transform: scale(1.9); opacity: 0; stroke-width: 1; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    @keyframes spotBadgeFade {
      0%, 64% { opacity: 0; transform: translateY(3px) scale(0.9); }
      72%, 86% { opacity: 1; transform: translateY(0) scale(1); }
      92%, 100% { opacity: 0; transform: translateY(-2px) scale(0.95); }
    }
    .route-active-line {
      stroke-dasharray: 160;
      animation: mapRouteTrace 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .user-nav-dot {
      offset-path: path("M 36 76 C 54 76, 68 58, 102 54 C 132 50, 146 38, 168 28");
      animation: mapUserTravel 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .user-pulse-ring {
      animation: userHaloPulse 3.8s ease-out infinite;
      transform-origin: 36px 76px;
    }
    .spot-marker-group {
      animation: spotPinReact 3.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 168px 28px;
    }
    .spot-ripple-circle {
      animation: spotRipplePulse 3.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      transform-origin: 168px 28px;
    }
    .spot-badge-group {
      animation: spotBadgeFade 3.8s ease-out infinite;
      transform-origin: 168px 6px;
    }
  </style>
  <div class="w-full max-w-[280px] bg-slate-50/70 border border-slate-100 rounded-2xl p-4 flex flex-col items-center justify-center">

        <!-- Base Dashed Route Guidance -->

        <!-- Destination Red Map Pin -->

          <!-- Ground shadow -->

            <circle cx="0" cy="-17.5" r="3.5" fill="#FFFFFF"></circle>
          </g>

</button><div class="w-full pt-1 pb-0.5 text-center flex flex-col items-center gap-3"><div class="grid grid-cols-3 gap-2 w-full pt-1.5"><div class="flex flex-col items-center text-center p-2 rounded-xl bg-transparent"><svg class="w-5 h-5 mb-1 text-[#2563eb]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg><span class="font-bold text-[11px] text-slate-900 tracking-wider uppercase">FIND</span><span class="text-[11px] text-slate-500 leading-tight mt-0.5">Nearby businesses</span></div><div class="flex flex-col items-center text-center p-2 rounded-xl bg-transparent"><svg class="w-5 h-5 mb-1 text-red-600" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></svg><span class="font-bold text-[11px] text-red-600 tracking-wider uppercase">GET SPOT</span><span class="text-[11px] text-slate-500 leading-tight mt-0.5">Join the live queue</span></div><div class="flex flex-col items-center text-center p-2 rounded-xl bg-transparent"><svg class="w-5 h-5 mb-1 text-[#f59e0b]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span class="font-bold text-[11px] text-slate-900 tracking-wider uppercase">ARRIVE</span><span class="text-[11px] text-slate-500 leading-tight mt-0.5">Come when your turn is near</span></div></div></div>

</button>

</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between">
<span class="font-headline-md font-semibold text-base text-slate-900 group-hover:text-slate-900 transition-colors">I’m a Worker</span>
<span class="material-symbols-outlined text-slate-400 text-lg group-hover:text-slate-800 group-hover:translate-x-0.5 transition-all">arrow_forward</span>
</div>

</div>
</button>

<script>
    (function() {
      const googleBtn = document.getElementById('googleAuthBtn');
      const googleBtnText = document.getElementById('googleBtnText');
      const roleModal = document.getElementById('roleSelectionModal');
      const roleContent = document.getElementById('roleModalContent');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const roleCards = document.querySelectorAll('.role-card');

      function openModal() {
        roleModal.classList.remove('opacity-0', 'pointer-events-none');
        roleContent.classList.remove('translate-y-full');
        roleContent.classList.remove('sm:translate-y-4');
        roleContent.classList.add('translate-y-0');
      }

      function closeModal() {
        roleModal.classList.add('opacity-0', 'pointer-events-none');
        roleContent.classList.remove('translate-y-0');
        roleContent.classList.add('translate-y-full', 'sm:translate-y-4');
      }

      if (googleBtn) {
        googleBtn.addEventListener('click', function() {
          const originalText = googleBtnText.textContent;
          googleBtnText.textContent = 'Connecting...';
          googleBtn.classList.add('opacity-80', 'pointer-events-none');

          setTimeout(() => {
            googleBtnText.textContent = originalText;
            googleBtn.classList.remove('opacity-80', 'pointer-events-none');
            openModal();
          }, 600);
        });
      }

      if (closeModalBtn) {
        closeModalBtn.addEventListener('click', closeModal);
      }

      roleModal.addEventListener('click', function(e) {
        if (e.target === roleModal) {
          closeModal();
        }
      });

      roleCards.forEach(card => {
        card.addEventListener('click', function() {
          const roleTitle = this.querySelector('.font-semibold').textContent;
          card.classList.add('ring-2', 'ring-offset-1');
          setTimeout(() => {
            closeModal();
            card.classList.remove('ring-2', 'ring-offset-1');
          }, 300);
        });
      });
    })();
  </script>
